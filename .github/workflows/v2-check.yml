name: Telegram Quiz V2 checks
on:
  pull_request:
    paths:
      - 'v2/**'
      - '.github/workflows/v2-check.yml'
  push:
    branches:
      - 'feature/telegram-admin-v2'
    paths:
      - 'v2/**'
jobs:
  syntax-and-unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check src/worker.js
      - run: node --check public/app.js
      - run: node --check public/importer.js
      - run: node --test tests/*.test.mjs
